<!doctype html><html lang="en"><meta charset="utf-8"><title>Edu animation capture</title><link rel="stylesheet" href="../assets/mascot.css"><link rel="stylesheet" href="../assets/theme.css"><style>
*{box-sizing:border-box}body{margin:0;background:#11100f;color:#fff5e9;font-family:Arial,sans-serif}.banner{width:1000px;height:440px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 75% 75%,#2c2219 0%,#161311 40%,#11100f 75%);border:1px solid #383026;border-radius:22px}.copy{position:absolute;left:66px;top:72px}.eyebrow{color:#a79b8c;letter-spacing:4px;font-size:12px}.title{font-size:116px;line-height:1;letter-spacing:-7px;margin:28px 0 16px;font-weight:700}.title span{color:#fb7830}.tag{font-size:21px;color:#c2b5a5}.chips{display:flex;gap:9px;margin-top:34px}.chip{padding:8px 12px;border:1px solid #4d3a2b;border-radius:20px;color:#d5b898;font-size:11px;letter-spacing:1px}#edu{position:absolute;width:235px;left:665px;top:82px}.leaf{position:absolute;left:626px;top:56px;color:#80775e;font-size:11px;letter-spacing:2px}.foot{position:absolute;bottom:24px;left:66px;color:#7c7064;font-size:11px;letter-spacing:2px}input{width:800px;margin:25px}
</style><body><section class="banner"><div class="copy"><div class="eyebrow">EDUPORT’S LITTLE STUDY BUDDY</div><div class="title">Meet Edu<span>.</span></div><div class="tag">A little warmth for whatever you’re building.</div><div class="chips"><span class="chip">7 ORIGINAL POSES</span><span class="chip">FULL OF PERSONALITY</span></div></div><div id="edu"></div><div class="foot">SVG + CSS + JAVASCRIPT &nbsp; / &nbsp; MADE TO MOVE</div></section><label>Frame <input type="range" min="0" max="59" value="0" id="frame"></label><script type="module">
import {mascot} from '../assets/mascot.js';
const edu=mascot('sit',{interactive:false,calm:true});document.querySelector('#edu').append(edu.el);edu.state('wave');
const draw=()=>{for(const a of document.getAnimations()){a.pause();a.currentTime=Number(document.querySelector('#frame').value)*80;}};
document.querySelector('#frame').addEventListener('input',draw);requestAnimationFrame(draw);
</script></body></html>
